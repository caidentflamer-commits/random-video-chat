<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Random Video Chat</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --accent: #4f7cff;
    --accent-hover: #3f6bef;
    --danger: #ff5470;
    --text: #e7e9ee;
    --muted: #8a90a2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    font-weight: 600;
    font-size: 18px;
    border-bottom: 1px solid #262a36;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  header .dot.live { background: #35d07f; }
  .videos {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
    min-height: 0;
  }
  .video-wrap {
    position: relative;
    background: var(--panel);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  .label {
    position: absolute;
    left: 12px; bottom: 12px;
    background: rgba(0,0,0,0.55);
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .placeholder {
    position: absolute;
    color: var(--muted);
    font-size: 15px;
    text-align: center;
    padding: 20px;
  }
  .controls {
    padding: 14px;
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    border-top: 1px solid #262a36;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: background 0.15s;
  }
  .btn-start { background: var(--accent); }
  .btn-start:hover { background: var(--accent-hover); }
  .btn-next { background: var(--danger); }
  .btn-next:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.5; cursor: default; }
  .status {
    color: var(--muted);
    font-size: 14px;
    min-width: 160px;
    text-align: center;
  }
  @media (max-width: 700px) {
    .videos { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <span class="dot" id="conn-dot"></span>
    Random Video Chat
  </header>

  <div class="videos">
    <div class="video-wrap">
      <video id="remote" autoplay playsinline></video>
      <div class="placeholder" id="remote-placeholder">No stranger yet</div>
      <div class="label">Stranger</div>
    </div>
    <div class="video-wrap">
      <video id="local" autoplay playsinline muted></video>
      <div class="placeholder" id="local-placeholder">Your camera is off</div>
      <div class="label">You</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn">Start</button>
    <button class="btn-next" id="nextBtn" disabled>Next</button>
    <div class="status" id="status">Click Start to turn on your camera.</div>
  </div>

<script>
/*
 * Frontend logic. Three moving parts:
 *   1. getUserMedia  -> turn on the local camera/mic.
 *   2. WebSocket     -> talk to our matchmaking server.
 *   3. RTCPeerConnection -> the actual peer-to-peer video link.
 */

// Free public STUN server (helps browsers find each other behind routers).
// For connections that STUN can't fix, you'd add a TURN server here later.
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const statusEl = document.getElementById('status');
const connDot = document.getElementById('conn-dot');
const localVideo = document.getElementById('local');
const remoteVideo = document.getElementById('remote');
const localPlaceholder = document.getElementById('local-placeholder');
const remotePlaceholder = document.getElementById('remote-placeholder');

let localStream = null;
let ws = null;
let pc = null;          // the current RTCPeerConnection
let isInitiator = false;

function setStatus(text) { statusEl.textContent = text; }

// --- Step 1: camera + connect to the server -------------------------------

startBtn.onclick = async () => {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (err) {
    setStatus('Could not access camera/mic. Please allow permission.');
    return;
  }
  localVideo.srcObject = localStream;
  localPlaceholder.style.display = 'none';
  startBtn.disabled = true;
  nextBtn.disabled = false;

  connectToServer();
};

function connectToServer() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    connDot.classList.add('live');
    setStatus('Looking for a stranger...');
    ws.send(JSON.stringify({ type: 'ready' }));
  };

  ws.onclose = () => {
    connDot.classList.remove('live');
    setStatus('Disconnected from server.');
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    switch (msg.type) {
      case 'waiting':
        setStatus('Waiting for someone to join...');
        break;

      case 'matched':
        isInitiator = msg.initiator;
        setStatus('Stranger found! Connecting...');
        await startCall();
        break;

      case 'signal':
        await handleSignal(msg.data);
        break;

      case 'partner-left':
        setStatus('Stranger left. Finding a new one...');
        endCall();
        ws.send(JSON.stringify({ type: 'ready' }));
        break;
    }
  };
}

// --- Step 2: the WebRTC connection ----------------------------------------

async function startCall() {
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  // Send our camera/mic to the other side.
  localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

  // Show the other side's video when it arrives.
  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
    remotePlaceholder.style.display = 'none';
    setStatus('Connected! Say hi.');
  };

  // Whenever we discover a network path, send it to the partner.
  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({ type: 'signal', data: { candidate: event.candidate } }));
    }
  };

  // The initiator kicks off the handshake with an "offer".
  if (isInitiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'signal', data: { sdp: pc.localDescription } }));
  }
}

async function handleSignal(data) {
  if (!pc) return;

  if (data.sdp) {
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    // If we got an offer, we answer it.
    if (data.sdp.type === 'offer') {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'signal', data: { sdp: pc.localDescription } }));
    }
  } else if (data.candidate) {
    try {
      await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    } catch (err) {
      // Ignore candidates that arrive too early; WebRTC will recover.
    }
  }
}

function endCall() {
  if (pc) {
    pc.close();
    pc = null;
  }
  remoteVideo.srcObject = null;
  remotePlaceholder.style.display = 'block';
}

// --- Step 3: the Next button ----------------------------------------------

nextBtn.onclick = () => {
  setStatus('Finding a new stranger...');
  endCall();
  ws.send(JSON.stringify({ type: 'next' }));
};
</script>
</body>
</html>
